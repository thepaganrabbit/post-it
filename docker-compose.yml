version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: postit-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: postit
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - postit-network

  # NestJS Backend
  backend:
    build:
      context: ./postit-back
      dockerfile: Dockerfile
    container_name: postit-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_HOST: mongodb
      DATABASE_PORT: 27017
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: password123
      DATABASE_NAME: postit
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - postit-network
    volumes:
      - ./postit-back/src:/app/src
      - ./postit-back/node_modules:/app/node_modules

  # Next.js Frontend
  frontend:
    build:
      context: ./postit-front
      dockerfile: Dockerfile
    container_name: postit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3002
    depends_on:
      - backend
    networks:
      - postit-network
    volumes:
      - ./postit-front/src:/app/src
      - ./postit-front/public:/app/public
      - ./postit-front/node_modules:/app/node_modules

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  postit-network:
    driver: bridge
